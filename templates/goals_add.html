{% extends "layout.html" %}

{% block title %}
    Goals/Add
{% endblock %}

{% block main %}

<h2 class="mb-4">Add Goal</h2>

<form action="/goals/add" method="post">

    <div class="mb-3">
        <input
            class="form-control mx-auto w-auto"
            name="category"
            id="category"
            placeholder="Category"
            autocomplete="off"
            autofocus
            type="text"
        >
    </div>

    <div class="mb-3">
        <input
            class="form-control mx-auto w-auto"
            name="target"
            id="target"
            placeholder="Target Hours"
            autocomplete="off"
            type="number"
            min="1"
            step="0.5"
        >
    </div>

    <button class="btn btn-primary" type="submit">
        Add Goal
    </button>

</form>

{% endblock %}
